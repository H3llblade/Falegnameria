name: Verifica e deploy

# - Ogni push / pull request: verifica (TypeScript, lint, test con PostgreSQL, build).
# - Deploy MANUALE: Actions → "Verifica e deploy" → Run workflow.
# - Deploy AUTOMATICO dopo push sul branch di produzione solo se la variabile
#   di repository AUTO_DEPLOY vale "true".
#
# Secrets richiesti (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY   (chiave privata dedicata al deploy)
#   VPS_PORT (facoltativo, default 22), VPS_KNOWN_HOSTS (facoltativo ma consigliato)
# Variables (facoltative): AUTO_DEPLOY, DEPLOY_DIR (/Falegnameria), PM2_NAME (falegnameria),
#   PRODUCTION_BRANCH (main), PUBLIC_URL (https://falegnameria.devicloud.me)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_destructive_migrations:
        description: "Consenti migrazioni distruttive (solo dopo aver verificato il backup)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifica del codice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: falegnameria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/falegnameria_test?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/falegnameria_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Controllo TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (unitari e scenari su PostgreSQL)
        run: npm test
      - name: Build di verifica
        run: npm run build

  deploy:
    name: Deploy sulla VPS
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true' && github.ref_name == (vars.PRODUCTION_BRANCH || 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/Falegnameria' }}
      PM2_NAME: ${{ vars.PM2_NAME || 'falegnameria' }}
      BRANCH: ${{ vars.PRODUCTION_BRANCH || 'main' }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://falegnameria.devicloud.me' }}
    steps:
      - name: Controllo branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "${BRANCH}" ]; then
            echo "::error::Il deploy è consentito solo dal branch ${BRANCH} (richiesto: ${GITHUB_REF_NAME})"; exit 1
          fi
      - name: Configurazione SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ]; then echo "::error::Secrets VPS_HOST / VPS_SSH_KEY mancanti"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy del commit ${{ github.sha }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          ALLOW: ${{ inputs.allow_destructive_migrations && '1' || '0' }}
        run: |
          # Lo script di deploy viene preso dal commit approvato (non dalla copia sul server)
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$USER@$HOST" \
            "set -e; cd '$DEPLOY_DIR' && git fetch --quiet origin '$BRANCH' && \
             git show '${GITHUB_SHA}:scripts/deploy.sh' > /tmp/falegnameria-deploy.sh && \
             APP_DIR='$DEPLOY_DIR' PRODUCTION_BRANCH='$BRANCH' PM2_NAME='$PM2_NAME' ALLOW_DESTRUCTIVE_MIGRATIONS='$ALLOW' \
             bash -l /tmp/falegnameria-deploy.sh '${GITHUB_SHA}'"
      - name: Health check pubblico
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$PUBLIC_URL/api/health" | tee /dev/stderr | grep -q '"status":"ok"'; then exit 0; fi
            sleep 5
          done
          echo "::error::Health check pubblico fallito su $PUBLIC_URL"; exit 1
      - name: Riepilogo
        if: always()
        run: |
          echo "### Deploy ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\` · URL: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Pulizia chiave
        if: always()
        run: rm -f ~/.ssh/deploy_key

# Virtual host dedicato a __DOMAIN__ → Next.js su 127.0.0.1:__PORT__
# Installato da scripts/vps/setup.sh in /etc/nginx/sites-available/__DOMAIN__.conf
# Certbot (--nginx --redirect) aggiunge il blocco HTTPS e il reindirizzamento HTTP → HTTPS.

upstream falegnameria_app {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Header di sicurezza (la CSP è inviata dall'applicazione)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 6m;   # immagini ricettario (2 MB) + margine
    server_tokens off;

    access_log /var/log/nginx/falegnameria.access.log;
    error_log  /var/log/nginx/falegnameria.error.log warn;

    location /_next/static/ {
        proxy_pass http://falegnameria_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://falegnameria_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

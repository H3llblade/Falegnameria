services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # condivide la rete del database: PostgreSQL è raggiungibile su localhost:5432
    network_mode: service:db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: falegnameria
      POSTGRES_PASSWORD: falegnameria_dev
      POSTGRES_DB: falegnameria
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
